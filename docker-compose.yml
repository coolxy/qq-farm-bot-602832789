services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      # 默认基础镜像用全限定地址，避开 docker.io 与失效的 registry mirror
      # （如 fnOS 的 docker.fnnas.com 对 library/* 返回 401）。不需要改宿主机
      # 的 daemon.json / 镜像站 / .env；想切回官方源只需重建时传环境变量：
      #   NODE_IMAGE=node:20.19.6-alpine3.21 docker compose up -d --build
      # 此默认值须与 core/Dockerfile 的 ARG NODE_IMAGE 保持一致。
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20.19.6-alpine3.21}
        PNPM_VERSION: ${PNPM_VERSION:-10.30.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped
    # 让 docker 注入 tini 作为 PID 1，node 变成它的子进程：
    #   - node 不再直接当 PID 1，信号语义回到正常进程该有的样子；
    #   - worker 子进程被回收后有 init 负责收尸，不会堆僵尸。
    # 停服本身靠 core/client.ts 里的 SIGTERM 钩子（先等凭证写盘收尾再退出），
    # 两者缺一不可：init 管进程树，钩子管「别把滚动中的 refreshtoken 切在中间」。
    init: true
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - qq-farm-data:/app/core/data
      - qq-farm-logs:/app/core/data/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
      # 更新作业的状态/日志落在数据卷里，而不是容器的可写层：
      # 一键更新会重建这个容器，写在容器里的进度会随之消失；放卷里则新容器起来后
      # 能接着把进度、日志和结论读出来，「更新完就看不到结果」这件事不会发生。
      - FARM_RUNTIME_DIR=/app/core/data/runtime
    healthcheck:
      # 用容器自带的 node 发请求，不用 wget：alpine 的 busybox wget 解析 localhost
      # 时会先试 ::1，而应用只监听 IPv4 的 0.0.0.0，可能直接连接被拒 → 容器一直挂
      # unhealthy。指到 127.0.0.1 再用 node 自带 fetch，和「服务真的没起来」区分得开。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/api/game-version',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 宿主机更新助手：让面板上的「立即更新」在容器部署下也能用。
  #
  # 为什么必须是独立容器：更新要重建的正是 qq-farm-bot 这个容器自己。放在应用容器
  # 里当子进程，会在 docker stop 的那一刻一起被杀，更新只做一半；放在这里，它是
  # 「活着把自己换掉」的那一方。它只需要三样东西：docker.sock（指挥宿主机 daemon）、
  # 项目目录（git pull）、数据卷（和面板交换请求与进度）。
  #
  # 默认不启动，用 profiles 门控：挂 docker.sock 等于把宿主机 root 权限交出去，
  # 这种能力必须由用户显式打开，不能靠默认值替他决定。
  #   docker compose --profile update up -d      # 启用（之后面板即可一键更新）
  #   docker compose --profile update rm -sf updater   # 关掉
  # 也可以在 .env 里写 COMPOSE_PROFILES=update，之后普通的 up -d 就会带上它。
  #
  # 镜像用全限定名，理由同 NODE_IMAGE：短名会走 registry mirror，国内 NAS 上常见 401。
  # 换源：UPDATER_IMAGE=docker.io/library/docker:27-cli docker compose --profile update up -d
  updater:
    image: ${UPDATER_IMAGE:-docker.m.daocloud.io/library/docker:27-cli}
    container_name: qq-farm-bot-updater
    restart: unless-stopped
    # 和应用容器一样让 tini 当 PID 1：否则 `docker stop` 要等满 10 秒再 SIGKILL，
    # 打断正在跑的 git pull / 构建。
    init: true
    profiles: ["update"]
    working_dir: /project
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 项目目录：git pull 改的是宿主机这份源码，重建用的也是这份 compose 文件。
      - .:/project
      # 和应用共用数据卷，只为了交换 update-request / update-job / 心跳
      - qq-farm-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - UPDATE_PROJECT_DIR=/project
      - UPDATE_DATA_DIR=/data
      - UPDATE_POLL_SECONDS=${UPDATE_POLL_SECONDS:-3}
      # 私密仓库才需要；公开仓库留空即可。用令牌时请同时在宿主机 `git remote`
      # 保持 https 形式，脚本会用它拼一次性认证 URL，不写进 .git/config。
      - UPDATE_GIT_TOKEN=${UPDATE_GIT_TOKEN:-}
    # 先把脚本复制到 /tmp 再执行：更新会改写项目目录，直接跑被改写的脚本
    # 会让正在执行的 sh 读到半截内容（边读边执行）。
    entrypoint: ["/bin/sh", "-c", "cp /project/scripts/docker-update-agent.sh /tmp/update-agent.sh && exec /bin/sh /tmp/update-agent.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-data:
    name: qq-farm-data
  qq-farm-logs:
    name: qq-farm-logs
