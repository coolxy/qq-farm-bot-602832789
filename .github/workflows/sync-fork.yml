name: Sync fork with upstream
on:
  schedule:
    - cron: "35 * * * *"   # 每天 UTC 03:00 自动同步
  workflow_dispatch:       # 手动触发
permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: 602832789/qq-farm-bot
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git

      - name: Fetch upstream
        run: git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Merge upstream into fork
        run: git merge upstream/${{ env.UPSTREAM_BRANCH }}

      - name: Push changes
        run: git push origin ${{ env.TARGET_BRANCH }}
