syntax = "proto3";
package gamepb.activitypb;
import "corepb.proto";

// 以薯换福（2026-11 活动）：字段号来自官方客户端 2026-11-25 抓包，
// 与上游社区实现（Anrylin/qq-farm-bot v2026.11.25.8 镜像内的 activity-data/sweet-potato.proto）逐字段一致。
// 未验证字段保持原名 field_N，不要凭猜测改号。
message SweetPotatoHead {
    int64 id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    string extra = 5;
    int64 start_time = 6;
    int64 end_time = 7;
    int32 status = 20;
}

message SweetPotatoClaims {
    bool seed_claimed = 1;
    bool share_claimed = 2;
}

message SweetPotatoShareState {
    int64 bonus = 1;
    int64 field_2 = 2;
    int64 timestamp = 3;
    int64 field_4 = 4;
}

// 状态槽 130 的 4 号子槽：动作标记。实机只保留最近一次动作（卖出 / 分享 /
// 领种子互相覆盖），**不能**用来判断「今天是否已领种子」，仅供排查对账。
message SweetPotatoActionSlot {
    int64 field_1 = 1;
    int64 field_2 = 2;
    int64 field_3 = 3;
}

message SweetPotatoState {
    SweetPotatoClaims claims = 1;
    SweetPotatoShareState share = 2;
    int64 coins = 3;
    SweetPotatoActionSlot actions = 4;
    int64 base_price = 5;
    int64 bonus_price = 6;
    int64 capacity = 7;
    // 待领取的收购提成（好友把蜜薯卖进你的铺子后按比例产生）。
    // 2026-11-25 15:11 抓包实机 86，cmd 99 领取后该字段消失、coins +86；没有提成时字段缺失（不是 0）。
    int64 pending_commission = 11;
    // 与 11 同时出现/消失的标记，实机恒为 1，语义未取证。
    int64 commission_flag = 13;
}

message SweetPotatoActivity {
    SweetPotatoHead head = 1;
    repeated SweetPotatoActivity children = 2;
    SweetPotatoState state = 130;
}

message SweetPotatoGroupReply {
    SweetPotatoActivity group = 1;
}

message SweetPotatoEmpty {}

message SweetPotatoShopRequest {
    int64 host_gid = 1;
}

message SweetPotatoSellRequest {
    int64 host_gid = 1;
    int64 count = 2;
}

// cmd 96 兑换下单：index 为目录序号，count 为兑换数量。
message SweetPotatoExchangeRequest {
    int64 index = 1;
    int64 count = 2;
}

message SweetPotatoExchangeGrant {
    int64 item_id = 1;
    int64 count = 2;
    int64 field_3 = 3;
    int64 field_6 = 6;
    int64 field_7 = 7;
}

message SweetPotatoExchangeReply {
    int64 price = 1;
    SweetPotatoExchangeGrant grant = 2;
    int64 coins = 3;
    int64 field_4 = 4;
    int64 field_5 = 5;
}

// cmd 97 兑换目录。协议只下发序号/价格/状态/限购，item_id 由客户端静态表映射。
message SweetPotatoCatalogGoods {
    int64 index = 1;
    int64 price = 2;
    int64 status = 3;
    int64 limit = 4;
    // 兑换过之后出现，实机均取 1，疑似今日已兑次数与达上限标记，语义未取证。
    int64 field_5 = 5;
    int64 field_6 = 6;
    int64 field_7 = 7;
}

message SweetPotatoCatalog {
    repeated SweetPotatoCatalogGoods goods = 1;
    // 兑换过之后目录尾部会带福气币余额（实机 27120），与状态槽 field 3 一致。
    int64 coins = 2;
}

// cmd 99 领取收购提成。
message SweetPotatoCommissionReply {
    int64 amount = 1;
    int64 field_3 = 3;
    int64 coins = 4;
}

// 一条收购记录：好友把蜜薯卖进你的铺子，你按比例拿到提成。
// 2026-11-25 15:11 抓包：{1:1795590561, 2:1006806548, 3:30, 4:4320, 6:'风筝有风', 7:avatar, 8:114, 9:86}，
// 界面写「你收购了风筝有风 蜜薯30个，获得分红86」。
message SweetPotatoPurchaseRecord {
    // 收购时间（秒）。
    int64 timestamp = 1;
    // 卖家 gid。
    int64 gid = 2;
    // 收购数量。
    int64 count = 3;
    // 本次支付给卖家的福气币总额（实机 4320 = 30 × 144）。
    int64 total = 4;
    string name = 6;
    string avatar = 7;
    // 卖家等级，实机 114。
    int64 level = 8;
    // 本人从这笔收购里拿到的提成，实机 86。
    int64 commission = 9;
}

// cmd 95 收购记录列表：请求不带参数，回包按服务端顺序下发（一般从新到旧）。
message SweetPotatoRecordReply {
    repeated SweetPotatoPurchaseRecord records = 1;
}

// cmd 取值：91 领种子 / 92 查铺 / 93 出售 / 95 收购记录 /
//           96 兑换下单 / 97 兑换目录 / 98 分享 / 99 领提成。
// 请求体统一是 id + cmd + 与 cmd 对应的 selector（190 + cmd）。
message SweetPotatoOperateRequest {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoEmpty claim_seed = 191;
    SweetPotatoShopRequest get_shop = 192;
    SweetPotatoSellRequest sell = 193;
    SweetPotatoEmpty records = 195;
    SweetPotatoExchangeRequest exchange = 196;
    SweetPotatoEmpty catalog = 197;
    SweetPotatoEmpty share = 198;
    SweetPotatoEmpty claim_commission = 199;
}

message SweetPotatoOwner {
    int64 gid = 1;
    string name = 2;
    string avatar = 3;
    int64 level = 4;
}

// 铺子行情（cmd 92 回包）。字段语义对照实机抓包：
// 成交价 = base_price + bonus_price，两个字段都不能单独当成交价用（好友 99 + 66 = 165，界面同值）。
message SweetPotatoShop {
    int64 base_price = 1;
    int64 bonus_price = 2;
    // 该铺今日还能再收多少（官方 remain_quota）。成交后递减，满额 8000；
    // 自家铺子不占好友额度，这一项按「不限」处理。
    int64 remaining = 3;
    SweetPotatoOwner owner = 4;
}

message SweetPotatoShopReply {
    SweetPotatoShop shop = 1;
    // 该铺当前收不收薯：true 可收 / false 明确拒收 / 字段缺失（undefined）按可卖处理。
    // 对应官方 MapleMarketGetShopRsp 的 can_sell=2；旧版当 int64 且从没读过。
    bool can_sell = 2;
}

message SweetPotatoClaimReply {
    repeated corepb.Item rewards = 1;
}

message SweetPotatoSellReply {
    int64 count = 1;
    int64 price = 2;
    int64 income = 3;
    // 该铺每日接收额度**上限**（实机 8000），不是剩余额度；剩余量要自己按成交数递减。
    int64 daily_quota = 4;
    int64 coins = 5;
}

// 下发的单件道具。字段号与 corepb.Item 的 id/count 完全一致（1/2），
// 所以 cmd 91 的回包用 repeated corepb.Item 解出来和 li 版的 YshfGrantReply 同值。
message SweetPotatoGrant {
    int64 item_id = 1;
    int64 count = 2;
}

// 分享回包里的本人铺子信息（cmd 98），field 2 为分享 key。
message SweetPotatoSelfShop {
    int64 gid = 1;
    string share_key = 2;
    string avatar = 3;
    int64 level = 4;
    bytes field_5 = 5;
}

// cmd 98 分享回包。字段号按 li 版实机抓包对齐（旧版本把 2/3 写成了
// bonus_price/price，且 4 号当 bytes 分享凭证，三处都错，从没读过所以没暴露）。
message SweetPotatoShareReply {
    SweetPotatoGrant grant = 1;
    int64 price = 2;
    int64 field_3 = 3;
    SweetPotatoSelfShop shop = 4;
    int64 field_5 = 5;
    int64 field_6 = 6;
}

message SweetPotatoOperateReply {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoActivity activity = 3;
    SweetPotatoClaimReply claim_seed = 191;
    SweetPotatoShopReply get_shop = 192;
    SweetPotatoSellReply sell = 193;
    SweetPotatoRecordReply records = 195;
    SweetPotatoExchangeReply exchange = 196;
    SweetPotatoCatalog catalog = 197;
    SweetPotatoShareReply share = 198;
    SweetPotatoCommissionReply claim_commission = 199;
}
