syntax = "proto3";
package gamepb.activitypb;
import "corepb.proto";

// 以薯换福（2026-11 活动）：字段号来自官方客户端 2026-11-25 抓包，
// 与上游社区实现（Anrylin/qq-farm-bot v2026.11.25.8 镜像内的 activity-data/sweet-potato.proto）逐字段一致。
// 未验证字段保持原名 field_N，不要凭猜测改号。
message SweetPotatoHead {
    int64 id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    string extra = 5;
    int64 start_time = 6;
    int64 end_time = 7;
    int32 status = 20;
}

message SweetPotatoClaims {
    bool seed_claimed = 1;
    bool share_claimed = 2;
}

message SweetPotatoShareState {
    int64 bonus = 1;
    int64 field_2 = 2;
    int64 timestamp = 3;
    int64 field_4 = 4;
}

message SweetPotatoState {
    SweetPotatoClaims claims = 1;
    SweetPotatoShareState share = 2;
    int64 coins = 3;
    int64 base_price = 5;
    int64 bonus_price = 6;
    int64 capacity = 7;
}

message SweetPotatoActivity {
    SweetPotatoHead head = 1;
    repeated SweetPotatoActivity children = 2;
    SweetPotatoState state = 130;
}

message SweetPotatoGroupReply {
    SweetPotatoActivity group = 1;
}

message SweetPotatoEmpty {}

message SweetPotatoShopRequest {
    int64 host_gid = 1;
}

message SweetPotatoSellRequest {
    int64 host_gid = 1;
    int64 count = 2;
}

// cmd 取值：91 领种子 / 92 查铺子 / 93 出售 / 98 分享。
// 请求体统一是 id + cmd + 与 cmd 对应的 selector（191/192/193/198）。
message SweetPotatoOperateRequest {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoEmpty claim_seed = 191;
    SweetPotatoShopRequest get_shop = 192;
    SweetPotatoSellRequest sell = 193;
    SweetPotatoEmpty share = 198;
}

message SweetPotatoOwner {
    int64 gid = 1;
    string name = 2;
    string avatar = 3;
    int64 level = 4;
}

message SweetPotatoShop {
    int64 base_price = 1;
    int64 bonus_price = 2;
    int64 remaining = 3;
    SweetPotatoOwner owner = 4;
}

message SweetPotatoShopReply {
    SweetPotatoShop shop = 1;
    int64 field_2 = 2;
}

message SweetPotatoClaimReply {
    repeated corepb.Item rewards = 1;
}

message SweetPotatoSellReply {
    int64 count = 1;
    int64 price = 2;
    int64 income = 3;
    int64 remaining = 4;
    int64 coins = 5;
}

message SweetPotatoShareReply {
    repeated corepb.Item rewards = 1;
    int64 bonus_price = 2;
    int64 price = 3;
    // 分享凭证：不返回给前端，也不写日志。
    bytes share_payload = 4;
    int64 capacity = 5;
    int64 field_6 = 6;
}

message SweetPotatoOperateReply {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoActivity activity = 3;
    SweetPotatoClaimReply claim_seed = 191;
    SweetPotatoShopReply get_shop = 192;
    SweetPotatoSellReply sell = 193;
    SweetPotatoShareReply share = 198;
}
